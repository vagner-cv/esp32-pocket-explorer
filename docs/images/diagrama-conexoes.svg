<text x="90" y="625" fill="#14846d" font-family="Arial,sans-serif" font-size="18" font-weight="700">I²C compartilhado: 8 / 9</text>
<path d="M 391 583 L 432 583 L 432 428" stroke="#189b8a" stroke-width="5" fill="none"/>
<circle cx="432" cy="428" r="7" fill="#189b8a"/>
<!-- BUTTONS -->
<rect x="1032" y="184" width="340" height="226" rx="16" fill="#fff" stroke="#efad5f" stroke-width="3"/>
<rect x="1032" y="184" width="340" height="13" rx="6" fill="#efad5f"/>
<text x="1056" y="233" fill="#764818" font-family="Arial,sans-serif" font-size="25" font-weight="800">3 BOTÕES EXTERNOS</text>
<text x="1056" y="276" fill="#4f6471" font-family="Arial,sans-serif" font-size="19">Anterior</text>
<text x="1262" y="276" fill="#bd6a00" font-family="Arial,sans-serif" font-size="21" font-weight="800">GPIO10</text>
<text x="1056" y="318" fill="#4f6471" font-family="Arial,sans-serif" font-size="19">Confirmar / OK</text>
<text x="1262" y="318" fill="#bd6a00" font-family="Arial,sans-serif" font-size="21" font-weight="800">GPIO11</text>
<text x="1056" y="360" fill="#4f6471" font-family="Arial,sans-serif" font-size="19">Próximo</text>
<text x="1262" y="360" fill="#bd6a00" font-family="Arial,sans-serif" font-size="21" font-weight="800">GPIO12</text>
<path d="M 1031 301 L 989 301 L 989 340 L 956 340" stroke="#e39a3d" stroke-width="5" fill="none"/>
<!-- Battery -->
<rect x="1032" y="465" width="340" height="183" rx="16" fill="#fff" stroke="#a9b2bf" stroke-width="3" stroke-dasharray="9 5"/>
<text x="1056" y="512" fill="#394f61" font-family="Arial,sans-serif" font-size="24" font-weight="800">BATERIA 3,7 V</text>
<text x="1056" y="543" fill="#566878" font-family="Arial,sans-serif" font-size="19">Li-ion 500 mAh (planejada)</text>
<text x="1056" y="573" fill="#b45309" font-family="Arial,sans-serif" font-size="17" font-weight="700">Conector incompatível</text>
<text x="1056" y="597" fill="#687785" font-family="Arial,sans-serif" font-size="17">Polaridade e pinagem a conferir</text>
<path d="M 1030 571 L 957 571" stroke="#b6a69e" stroke-width="4" stroke-dasharray="10 8" fill="none"/>
<!-- footer -->
<rect x="67" y="762" width="1305" height="91" rx="14" fill="#e2ecf1" stroke="#cbdde5"/>
<text x="94" y="797" fill="#264657" font-family="Arial,sans-serif" font-size="18" font-weight="800">LEGENDA</text>
<line x1="214" y1="790" x2="267" y2="790" stroke="#238fd4" stroke-width="5"/><text x="278" y="797" fill="#426074" font-family="Arial,sans-serif" font-size="16">GPS UART</text>
<line x1="436" y1="790" x2="491" y2="790" stroke="#189b8a" stroke-width="5"/><text x="502" y="797" fill="#426074" font-family="Arial,sans-serif" font-size="16">I²C externo</text>
<line x1="691" y1="790" x2="745" y2="790" stroke="#e39a3d" stroke-width="5"/><text x="755" y="797" fill="#426074" font-family="Arial,sans-serif" font-size="16">Botões</text>
<line x1="910" y1="790" x2="965" y2="790" stroke="#b6a69e" stroke-width="4" stroke-dasharray="10 8"/><text x="977" y="797" fill="#426074" font-family="Arial,sans-serif" font-size="16">Pendente</text>
<text x="94" y="832" fill="#657a86" font-family="Arial,sans-serif" font-size="16">Ligação ilustrativa • Use alimentação e GND conforme seu módulo físico • Conferir firmware final.</text>
</svg>